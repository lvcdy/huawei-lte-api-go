name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GOOS/GOARCH 组合，对应 GitLab 期 deb/arch 多发行版打包
        target:
          - linux/amd64
          - linux/arm64
          - linux/386
          - linux/arm
          - windows/amd64
          - windows/386
          - darwin/amd64
          - darwin/arm64

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.27"

    - name: Derive binary name
      id: vars
      shell: bash
      run: |
        os_arch="${{ matrix.target }}"
        goos="${os_arch%/*}"
        goarch="${os_arch#*/}"
        echo "goos=$goos" >> "$GITHUB_OUTPUT"
        echo "goarch=$goarch" >> "$GITHUB_OUTPUT"
        if [ "$goos" = "windows" ]; then
          echo "ext=.exe" >> "$GITHUB_OUTPUT"
        else
          echo "ext=" >> "$GITHUB_OUTPUT"
        fi

    - name: Build cpecheck
      env:
        GOOS: ${{ steps.vars.outputs.goos }}
        GOARCH: ${{ steps.vars.outputs.goarch }}
      run: |
        go build -trimpath -o dist/cpecheck-${{ steps.vars.outputs.goos }}-${{ steps.vars.outputs.goarch }}${{ steps.vars.outputs.ext }} ./cmd/cpecheck

    - name: Build cpedebug
      env:
        GOOS: ${{ steps.vars.outputs.goos }}
        GOARCH: ${{ steps.vars.outputs.goarch }}
      run: |
        go build -trimpath -o dist/cpedebug-${{ steps.vars.outputs.goos }}-${{ steps.vars.outputs.goarch }}${{ steps.vars.outputs.ext }} ./cmd/cpedebug

    - name: Smoke test (native amd64 only)
      # 对应 GitLab 的 packagetest 阶段：安装产物后验证可用性。
      # 仅 amd64 二进制可在 ubuntu-latest runner 上原生执行，其余平台跳过。
      run: |
        ./dist/cpecheck-linux-amd64 -h >/dev/null
        ./dist/cpedebug-linux-amd64 -h >/dev/null
      if: steps.vars.outputs.goos == 'linux' && steps.vars.outputs.goarch == 'amd64'

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.target }}
        path: dist/*
        if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist-artifacts
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: dist-artifacts/*