[package]
name = "huawei-lte-api"
version = "0.1.0"
edition = "2021"
description = "Rust port of the huawei-lte-api (Salamek Python) plus supplementary endpoints from Brovi-Huawei-5G-CPE-Manager"
license = "MIT"
repository = "https://github.com/Salamek/huawei-lte-api"
keywords = ["huawei", "lte", "cpe", "router", "api"]
categories = ["network-programming", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "cookies", "json"], default-features = false }
quick-xml = "0.36"
rsa = "0.9"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.8"
hex = "0.4"
once_cell = "1"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"

[profile.release]
opt-level = 3
